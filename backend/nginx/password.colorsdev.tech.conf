# Password Manager — UI statica + API
# Incluso da AM nginx: include /etc/nginx/apps-enabled/*.conf;

server {
    listen 80;
    server_name password.colorsdev.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name password.colorsdev.tech;

    ssl_certificate     /etc/letsencrypt/live/password.colorsdev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/password.colorsdev.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # API FastAPI
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }

        proxy_pass http://password-manager:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker (PWA)
    location = /sw.js {
        root /var/www/password-manager-web;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        default_type application/javascript;
    }

    location = /manifest.webmanifest {
        root /var/www/password-manager-web;
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/manifest+json;
    }

    # Frontend web (Expo export)
    location / {
        root /var/www/password-manager-web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }
}
